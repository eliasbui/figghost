[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
macos-sys = { path = "crates/macos-sys" }
core-mouse = { path = "crates/core-mouse" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
objc2-service-management = "0.3"
objc2-core-graphics = "0.3"
dispatch2 = "0.3"
objc2-web-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "block2", "VNRequest", "VNRequestHandler", "VNObservation", "VNRecognizeTextRequest", "VNGenerateForegroundInstanceMaskRequest", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
core-foundation = "0.10"
libc = "0.2"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-clipboard = { path = "crates/core-clipboard" }
core-window = { path = "crates/core-window" }
core-agents = { path = "crates/core-agents" }
core-smart = { path = "crates/core-smart" }
core-lyrics = { path = "crates/core-lyrics" }
core-annotate = { path = "crates/core-annotate" }
core-calendar = { path = "crates/core-calendar" }
core-capture = { path = "crates/core-capture" }
objc2-event-kit = "0.3"
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "SCStream", "SCShareableContent", "SCScreenshotManager", "objc2-core-graphics", "objc2-core-foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
