[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.2.6"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
macos-sys = { path = "crates/macos-sys" }
core-mouse = { path = "crates/core-mouse" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
objc2-service-management = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
objc2-web-kit = "0.3"
objc2-vision = "0.3"
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-image-io = "0.3"
objc2-quartz-core = "0.3"
objc2-metal = "0.3"
core-foundation = "0.10"
libc = "0.2"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-clipboard = { path = "crates/core-clipboard" }
core-window = { path = "crates/core-window" }
core-agents = { path = "crates/core-agents" }
core-smart = { path = "crates/core-smart" }
core-lyrics = { path = "crates/core-lyrics" }
core-calendar = { path = "crates/core-calendar" }
core-capture = { path = "crates/core-capture" }
core-audio-fx = { path = "crates/core-audio-fx" }
core-typing = { path = "crates/core-typing" }
core-notes = { path = "crates/core-notes" }
core-netmerge = { path = "crates/core-netmerge" }
# The Telex and VNI engine of Gõ Nhanh, under the BSD 3-Clause licence (crates/app-ui/assets/GoNhanh-LICENSE.txt).
# It is not on crates.io, so it is pinned to the last commit that changed it.
gonhanh-core = { git = "https://github.com/khaphanspace/gonhanh.org", rev = "7ae856713adec91694c50d6ee38290b64b48bb3f" }
objc2-event-kit = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# The one cdylib (the Now Playing adapter, loaded by /usr/bin/perl) must not be stripped: the strip step of
# this toolchain leaves its LINKEDIT string pool misaligned, and dyld then refuses to load it with
# "mis-aligned LINKEDIT string pool", which silently leaves the app without Now Playing. The extra kilobytes
# are worth a library that loads.
[profile.release.package.nowplaying-adapter]
strip = false
