<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figghost - Tray popover preview</title>
<style>
:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --tint: #2f7bff;
  --desk: linear-gradient(135deg, #cfd6e6, #eef0f6 50%, #d9deec);
  --glass: linear-gradient(150deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  --inner: linear-gradient(150deg, rgba(255,255,255,.6), rgba(255,255,255,.22));
  --edge: rgba(255,255,255,.85); --hi: rgba(255,255,255,.95); --glow: rgba(255,255,255,.4);
  --shadow: 0 24px 60px -16px rgba(30,40,90,.45), 0 4px 14px rgba(30,40,90,.12);
  --text: #16161d; --text-2: #636370; --text-3: #9c9ca8;
  --fill: rgba(30,30,60,.07); --track: rgba(120,120,140,.28); --bar: rgba(255,255,255,.55);
}
[data-theme="dark"] {
  color-scheme: dark; --tint: #5c9bff;
  --desk: linear-gradient(135deg, #14161d, #232634 50%, #12141b);
  --glass: linear-gradient(150deg, rgba(70,72,86,.7), rgba(40,42,54,.6));
  --inner: linear-gradient(150deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  --edge: rgba(255,255,255,.22); --hi: rgba(255,255,255,.5); --glow: rgba(255,255,255,.08);
  --shadow: 0 24px 60px -12px rgba(0,0,0,.8);
  --text: #f4f4fa; --text-2: #a8a8ba; --text-3: #6c6c80;
  --fill: rgba(255,255,255,.1); --track: rgba(255,255,255,.22); --bar: rgba(30,32,42,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.35 var(--font); color: var(--text); -webkit-font-smoothing: antialiased; background: var(--desk); overflow: hidden; }
button { font: inherit; color: inherit; cursor: default; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menubar { position: fixed; inset: 0 0 auto; height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 14px; background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); font-size: 13px; font-weight: 500; }
.menubar .trayicon { display: grid; place-items: center; width: 28px; height: 20px; border-radius: 6px; background: var(--fill); }
.menubar .trayicon svg { width: 15px; height: 15px; fill: currentColor; }
.pop { position: fixed; top: 36px; right: 14px; width: 348px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-radius: 28px; background: var(--glass); -webkit-backdrop-filter: blur(34px) saturate(1.9); backdrop-filter: blur(34px) saturate(1.9); box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1.5px 0 var(--hi), inset 0 -16px 30px -10px var(--glow), var(--shadow); }
.head { display: flex; align-items: center; gap: 12px; padding: 4px 4px 2px; }
.logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, #8b7bff, #5b4bf0); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
.logo svg { width: 24px; height: 24px; fill: #fff; }
.head .t { flex: 1; min-width: 0; } .head b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.head .t span { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tint); }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--fill); color: var(--text-2); box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi); }
.icon-btn:hover { color: var(--text); }
.card { border-radius: 20px; background: var(--inner); box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi); overflow: hidden; }
.lab { margin: 2px 8px -4px; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; min-height: 46px; }
.row + .row { border-top: .5px solid var(--track); }
.ri { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--text-2); flex: none; }
.ri .ic { width: 16px; height: 16px; }
.rt { flex: 1; min-width: 0; } .rt b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt span { color: var(--text-2); font-size: 11.5px; }
.switch { position: relative; width: 40px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: var(--track); transition: background .12s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1.5px 4px rgba(0,0,0,.3); transition: transform .12s ease-out; }
.switch[aria-checked="true"] { background: var(--tint); } .switch[aria-checked="true"]::after { transform: translateX(16px); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 8px; border: 0; border-radius: 16px; background: none; color: var(--text-2); font-size: 11.5px; transition: background .12s, color .12s; }
.tile:hover { background: var(--fill); color: var(--text); }
.tile .ic { width: 22px; height: 22px; }
.tile.on { background: var(--tint); color: #fff; }
.clip { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; }
.clip .rt { flex: 1; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--fill); font: 600 11px var(--font); }
.btn { height: 28px; padding: 0 13px; border: 0; border-radius: 999px; background: var(--fill); font-size: 12.5px; font-weight: 550; box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi); }
.btn:active { opacity: .7; } .btn.danger { color: #d4443a; }
.foot { display: flex; align-items: center; gap: 6px; padding: 2px 2px 0; }
.foot .btn { display: inline-flex; align-items: center; gap: 6px; } .foot .btn .ic { width: 15px; height: 15px; }
.foot .sp { flex: 1; }
.theme { position: fixed; left: 18px; top: 44px; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); }
.theme button { height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--text-2); font-size: 12.5px; }
.theme button[aria-checked="true"] { background: var(--text); color: var(--desk-fg, #fff); }
[data-theme="dark"] .theme button[aria-checked="true"] { color: #111; }
.note { position: fixed; left: 18px; bottom: 18px; max-width: 360px; color: var(--text-2); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style></head><body>

<div class="pop" role="dialog" aria-label="Figghost">

<script>
document.addEventListener('click', e => {
  const sw = e.target.closest('.switch'); if (sw) sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true');
  const l = e.target.closest('#login'); if (l) { const on = l.getAttribute('aria-pressed') !== 'true'; l.setAttribute('aria-pressed', on); l.lastChild.textContent = on ? 'Login: on' : 'Login: off'; }
  const b = e.target.closest('#theme button'); if (b) { document.documentElement.dataset.theme = b.dataset.v; document.querySelectorAll('#theme button').forEach(x => x.setAttribute('aria-checked', x === b)); }
});
</script></body></html>
