[package]
name = "core-netmerge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# A socket bound to an interface and an address before it connects, with a time limit on connecting.
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The interfaces and their addresses (getifaddrs).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
