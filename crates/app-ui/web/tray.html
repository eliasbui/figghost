<title>Figghost</title>
<style>
:root { color-scheme: light dark; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; --tint: #2f7bff;
  --inner: linear-gradient(150deg, rgba(255,255,255,.6), rgba(255,255,255,.22)); --edge: rgba(255,255,255,.85); --hi: rgba(255,255,255,.95);
  --text: #16161d; --text-2: #5c5c68; --text-3: #8e8e9a; --fill: rgba(30,30,60,.08); --track: rgba(120,120,140,.28); --bad: #d4443a; }
@media (prefers-color-scheme: dark) { :root { --tint: #5c9bff; --inner: linear-gradient(150deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  --edge: rgba(255,255,255,.2); --hi: rgba(255,255,255,.45); --text: #f4f4fa; --text-2: #b0b0c0; --text-3: #7c7c8e; --fill: rgba(255,255,255,.1); --track: rgba(255,255,255,.22); --bad: #ff6b60; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font: 13px/1.35 var(--font); color: var(--text); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden; }
button { font: inherit; color: inherit; cursor: default; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#root { width: 348px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.head { display: flex; align-items: center; gap: 12px; padding: 4px 4px 2px; }
.logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, #8b7bff, #5b4bf0); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
.logo svg { width: 24px; height: 24px; fill: #fff; }
.head b { flex: 1; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--fill); color: var(--text-2); box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi); }
.icon-btn:hover { color: var(--text); }
.warn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-radius: 18px; background: color-mix(in srgb, var(--tint) 16%, transparent); box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--tint) 45%, transparent); text-align: left; font-weight: 500; }
.card { border-radius: 20px; background: var(--inner); box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 8px 14px; border: 0; background: none; text-align: left; }
.row + .row { border-top: .5px solid var(--track); }
button.row:hover { background: var(--fill); }
.ri { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--text-2); flex: none; }
.ri .ic { width: 16px; height: 16px; }
.rt { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.bad .rt, .row.bad .ri { color: var(--bad); }
.switch { position: relative; width: 40px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: var(--track); transition: background .12s; flex: none; pointer-events: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1.5px 4px rgba(0,0,0,.3); transition: transform .12s ease-out; }
.switch.on { background: var(--tint); } .switch.on::after { transform: translateX(16px); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; min-height: 66px; padding: 10px 2px 8px; border: 0; border-radius: 16px; background: none; color: var(--text-2); font-size: 11px; line-height: 1.2; text-align: center; transition: background .12s, color .12s; }
.tile:hover { background: var(--fill); color: var(--text); }
.tile .ic { width: 22px; height: 22px; }
.tile span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.live { background: var(--bad); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

:"<path d=\"m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5\" /> <rect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\" />","hand":"<path d=\"M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2\" /> <path d=\"M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2\" /> <path d=\"M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8\" /> <path d=\"M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15\" />","scroll-text":"<path d=\"M15 12h-5\" /> <path d=\"M15 8h-5\" /> <path d=\"M19 17V5a2 2 0 0 0-2-2H4\" /> <path d=\"M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3\" />","images":"<path d=\"M18 22H4a2 2 0 0 1-2-2V6\" /> <path d=\"m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18\" /> <circle cx=\"12\" cy=\"8\" r=\"2\" /> <rect width=\"16\" height=\"16\" x=\"6\" y=\"2\" rx=\"2\" />","circle-stop":"<circle cx=\"12\" cy=\"12\" r=\"10\" /> <rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" rx=\"1\" />","panel-top":"<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M3 9h18\" />","camera":"<path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z\" /> <circle cx=\"12\" cy=\"13\" r=\"3\" />","sparkles":"<path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z\" /> <path d=\"M20 3v4\" /> <path d=\"M22 5h-4\" /> <path d=\"M4 17v2\" /> <path d=\"M5 18H3\" />","circle":"<circle cx=\"12\" cy=\"12\" r=\"10\" />","chevron-right":"<path d=\"m9 18 6-6-6-6\" />"};

const $ = (s) => document.querySelector(s);
function h(tag, cls, ...kids) { const el = document.createElement(tag); if (cls) el.className = cls; for (const k of kids.flat()) if (k != null) el.append(k); return el; }
function glyph(symbol) { const span = document.createElement('span'); span.style.display = 'contents'; span.innerHTML = `<svg class="ic" viewBox="0 0 24 24">${LUCIDE[GLYPH[symbol]] || LUCIDE.circle}</svg>`; return span; }
function send(m) { window.fig.send(m); }
const LOGO = '<svg viewBox="0 0 24 24"><path d="M12 2.5c-4.4 0-7.5 3.2-7.5 7.6v9.2c0 .9 1 1.4 1.7.8l1.4-1.2 1.6 1.4c.5.4 1.2.4 1.6 0l1.2-1.1 1.2 1.1c.5.4 1.2.4 1.6 0l1.6-1.4 1.4 1.2c.7.6 1.7.1 1.7-.8v-9.2c0-4.4-3.1-7.6-7.5-7.6zM9.3 10.2a1.3 1.8 0 110 3.6 1.3 1.8 0 010-3.6zm5.4 0a1.3 1.8 0 110 3.6 1.3 1.8 0 010-3.6z"/></svg>';

// The entries of the menu come with their title, symbol, check and visibility; this groups them by what they are.
function render(items) {
  const shown = items.filter((i) => i.visible);
  const take = (test) => { const found = shown.filter((i) => !used.has(i.id) && test(i)); found.forEach((i) => used.add(i.id)); return found; };
  const used = new Set();
  const settings = take((i) => i.symbol === 'gearshape')[0];
  const access = take((i) => i.symbol === 'hand.raised')[0];
  const quit = [...shown].reverse().find((i) => i.symbol === 'xmark.rectangle');
  if (quit) used.add(quit.id);
  const login = take((i) => i.symbol === 'power' && i.checked !== null)[0];
  const config = take((i) => i.symbol === 'folder')[0];
  const clip = take((i) => i.symbol === 'doc.on.clipboard' || i.symbol === 'trash');
  const toggles = take((i) => i.checked !== null);
  const tiles = take(() => true);

  const root = $('#root');
  const logo = h('div', 'logo'); logo.innerHTML = LOGO;
  const head = h('div', 'head', logo, h('b', '', 'Figghost'));
  if (settings) { const b = h('button', 'icon-btn', glyph(settings.symbol)); b.title = settings.title; b.setAttribute('aria-label', settings.title); b.onclick = () => send({ t: 'run', id: settings.id }); head.append(b); }
  const out = [head];
  if (access) { const b = h('button', 'warn', glyph(access.symbol), h('span', 'rt', access.title)); b.onclick = () => send({ t: 'run', id: access.id }); out.push(b); }
  if (toggles.length) out.push(h('div', 'card', toggles.map((i) => {
    const sw = h('span', 'switch' + (i.checked ? ' on' : ''));
    const r = h('button', 'row', h('span', 'ri', glyph(i.symbol)), h('span', 'rt', i.title), sw);
    r.setAttribute('role', 'switch'); r.setAttribute('aria-checked', String(!!i.checked));
    r.onclick = () => send({ t: 'run', id: i.id, keep: true });
    return r;
  })));
  if (tiles.length) out.push(h('div', 'card', h('div', 'grid', tiles.map((i) => {
    const b = h('button', 'tile' + (i.symbol === 'stop.circle' ? ' live' : ''), glyph(i.symbol), h('span', '', i.title));
    b.title = i.title; b.onclick = () => send({ t: 'run', id: i.id });
    return b;
  }))));
  if (clip.length) out.push(h('div', 'card', clip.map((i) => {
    const r = h('button', 'row' + (i.symbol === 'trash' ? ' bad' : ''), h('span', 'ri', glyph(i.symbol)), h('span', 'rt', i.title));
    r.onclick = () => send({ t: 'run', id: i.id, keep: i.symbol === 'trash' });
    return r;
  })));
  const foot = [];
  if (login) { const r = h('button', 'row', h('span', 'ri', glyph(login.symbol)), h('span', 'rt', login.title), h('span', 'switch' + (login.checked ? ' on' : ''))); r.setAttribute('role', 'switch'); r.setAttribute('aria-checked', String(!!login.checked)); r.onclick = () => send({ t: 'run', id: login.id, keep: true }); foot.push(r); }
  if (config) { const r = h('button', 'row', h('span', 'ri', glyph(config.symbol)), h('span', 'rt', config.title)); r.onclick = () => send({ t: 'run', id: config.id }); foot.push(r); }
  if (quit) { const r = h('button', 'row bad', h('span', 'ri', glyph(quit.symbol)), h('span', 'rt', quit.title)); r.onclick = () => send({ t: 'run', id: quit.id }); foot.push(r); }
  if (foot.length) out.push(h('div', 'card', foot));
  root.replaceChildren(...out);
  send({ t: 'size', h: root.offsetHeight });
}

window.__fig = { recv(message) { if (message.t === 'state') render(message.items); } };
window.addEventListener('DOMContentLoaded', () => send({ t: 'ready' }));
