<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Figghost</title>
<style>
:root { color-scheme: light dark; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; --tint: -apple-system-control-accent;
  --text: #16161d; --text-2: #5c5c68; --text-3: #8e8e9a; --fill: rgba(30,30,60,.08); --line: rgba(120,120,140,.28); --track: rgba(120,120,140,.34); --bad: #d4443a; }
@media (prefers-color-scheme: dark) { :root { --text: #f4f4fa; --text-2: #b0b0c0; --text-3: #7c7c8e;
  --fill: rgba(255,255,255,.1); --line: rgba(255,255,255,.16); --track: rgba(255,255,255,.26); --bad: #ff6b60; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font: 13px/1.3 var(--font); color: var(--text); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden; }
button { font: inherit; color: inherit; cursor: default; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: -2px; }
.ic { width: 18px; height: 18px; flex: none; background-color: currentColor; -webkit-mask: var(--glyph) center / contain no-repeat; mask: var(--glyph) center / contain no-repeat; }
/* The width is the one TRAY_WIDTH gives the panel in macos-sys/src/webview.rs. */
#root { width: 276px; padding: 8px; }
.head { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 2px 0 4px; }
.logo { width: 28px; height: 28px; flex: none; }
.head b { flex: 1; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.icon-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--text-2); }
.icon-btn:hover { background: var(--fill); color: var(--text); }
.warn { display: flex; align-items: flex-start; gap: 8px; width: 100%; margin-top: 4px; padding: 8px 10px; border: 0; border-radius: 10px; background: color-mix(in srgb, var(--tint) 14%, transparent); text-align: left; font-size: 12px; line-height: 1.3; }
.warn .ic { width: 15px; height: 15px; margin-top: 1px; color: var(--tint); }
.warn span { text-wrap: balance; }
.group { margin-top: 6px; padding-top: 6px; border-top: .5px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; width: 100%; height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.row:hover { background: var(--fill); }
.row.bad { color: var(--bad); }
.rt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switch { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--track); transition: background .12s; flex: none; pointer-events: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .12s ease-out; }
.switch.on { background: var(--tint); } .switch.on::after { transform: translateX(12px); }
.tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.tool { position: relative; display: grid; place-items: center; height: 34px; padding: 0; border: 0; border-radius: 9px; background: none; color: var(--text-2); }
/* The hover fill fades by opacity only, which the compositor does without repainting the glass glyph mask each frame. */
.tool::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--fill); opacity: 0; transition: opacity .1s; }
.tool:hover { color: var(--text); }
.tool:hover::before { opacity: 1; }
.tool .ic { position: relative; }
.tool.live, .tool.live:hover { background: var(--bad); color: #fff; }
.tool.live::before { display: none; }
/* The name of the tool under the pointer; the line is always there, so the panel does not change height. */
.cap { height: 16px; margin-top: 2px; font-size: 11px; line-height: 16px; text-align: center; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>window.__icon = "/*__ICON__*/";</script>
<script>
const $ = (s) => document.querySelector(s);
function h(tag, cls, ...kids) { const el = document.createElement(tag); if (cls) el.className = cls; for (const k of kids.flat()) if (k != null) el.append(k); return el; }
// The SF Symbol of an entry comes drawn by the system as a picture; it is used as a mask, so it takes the text colour.
function glyph(src) { const span = h('span', 'ic'); if (src) span.style.setProperty('--glyph', `url("${src}")`); else span.style.visibility = 'hidden'; return span; }
function send(m) { window.fig.send(m); }

// The entries of the menu come with their title, symbol, check and visibility; this groups them by what they are.
function render(items) {
  const shown = items.filter((i) => i.visible);
  const used = new Set();
  const take = (test) => { const found = shown.filter((i) => !used.has(i.id) && test(i)); found.forEach((i) => used.add(i.id)); return found; };
  const is = (...symbols) => (i) => symbols.includes(i.symbol);
  const settings = take(is('gearshape'))[0];
  const access = take(is('hand.raised'))[0];
  const quit = [...shown].reverse().find(is('xmark.rectangle'));
  if (quit) used.add(quit.id);
  const login = take((i) => i.symbol === 'power' && i.checked !== null)[0];
  const config = take(is('folder'))[0];
  const clip = take(is('doc.on.clipboard', 'trash'));
  const toggles = take((i) => i.checked !== null);
  // A tool that is in the menu twice, as Stop recording is, is one tile.
  const seen = new Set();
  const tools = take(() => true).filter((i) => { const key = i.symbol + '|' + i.title; return !seen.has(key) && seen.add(key); });

  const row = (i, bad) => {
    const toggle = i.checked !== null;
    const r = h('button', 'row' + (bad ? ' bad' : ''), h('span', 'rt', i.title), toggle ? h('span', 'switch' + (i.checked ? ' on' : '')) : null);
    r.title = i.title;
    if (toggle) { r.setAttribute('role', 'switch'); r.setAttribute('aria-checked', String(i.checked)); }
    // A switch, and clearing the history, leave the panel open to show what they did.
    r.onclick = () => send({ t: 'run', id: i.id, keep: toggle || !!bad });
    return r;
  };
  const group = (...kids) => { const list = kids.flat().filter(Boolean); return list.length ? h('div', 'group', list) : null; };

  const head = h('div', 'head');
  if (/^data:/.test(window.__icon || '')) { const logo = h('img', 'logo'); logo.src = window.__icon; logo.alt = ''; head.append(logo); }
  head.append(h('b', '', 'Figghost'));
  if (settings) { const b = h('button', 'icon-btn', glyph(settings.icon)); b.title = settings.title; b.setAttribute('aria-label', settings.title); b.onclick = () => send({ t: 'run', id: settings.id }); head.append(b); }
  const out = [head];
  if (access) { const b = h('button', 'warn', glyph(access.icon), h('span', '', access.title)); b.onclick = () => send({ t: 'run', id: access.id }); out.push(b); }
  out.push(group(toggles.map((i) => row(i))));
  if (tools.length) {
    const cap = h('div', 'cap');
    out.push(group(h('div', 'tools', tools.map((i) => {
      const b = h('button', 'tool' + (i.symbol === 'stop.circle' ? ' live' : ''), glyph(i.icon));
      b.setAttribute('aria-label', i.title);
      b.onclick = () => send({ t: 'run', id: i.id });
      b.onpointerenter = b.onfocus = () => { cap.textContent = i.title; };
      b.onpointerleave = b.onblur = () => { cap.textContent = ''; };
      return b;
    })), cap));
  }
  out.push(group(clip.map((i) => row(i, i.symbol === 'trash'))));
  out.push(group(login && row(login), config && row(config), quit && row(quit)));

  const root = $('#root');
  root.replaceChildren(...out.filter(Boolean));
  send({ t: 'size', h: root.offsetHeight });
}

window.__fig = { recv(message) { if (message.t === 'state') render(message.items); } };
window.addEventListener('DOMContentLoaded', () => send({ t: 'ready' }));
</script>
</body>
</html>
